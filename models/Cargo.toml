[package]
name = "models"
version = "0.1.0"
edition = "2021"

[features]
postgres = ["diesel", "pgvector"]
testing = ["rand"]
ai = ["ollama-rs"]
vector-similarity = []

[dependencies]
serde.workspace = true
diesel = { version = "^2.2.4", optional = true }
pgvector = { version = "0.4.0", features = ["diesel"], optional = true }
ollama-rs = { workspace = true, optional = true }
rand = { version = "0.8", optional = true }
