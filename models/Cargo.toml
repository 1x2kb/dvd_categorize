[package]
name = "models"
version = "1.0.0"
edition = "2021"

[features]
postgres = ["diesel", "pgvector", "chrono"]
testing = ["rand"]
ai = ["ollama-rs"]
vector-similarity = []
text-matching = []

[dependencies]
serde.workspace = true
diesel = { version = "^2.2.4", features = ["chrono"], optional = true }
pgvector = { version = "0.4.0", features = ["diesel"], optional = true }
ollama-rs = { workspace = true, optional = true }
rand = { version = "0.8", optional = true }
chrono = { version = "0.4", optional = true }
