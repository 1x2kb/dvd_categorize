[package]
name = "models"
version = "1.0.0"
edition = "2021"
description = "Shared domain models and types with feature-gated functionality for postgres, AI, and testing"
readme = "README.md"

[features]
postgres = ["diesel", "pgvector", "chrono", "uuid"]
# MongoDB backend: shares the vector-similarity data shape but selects the
# document-store id representation. Mutually exclusive with `postgres`.
mongodb = ["vector-similarity"]
testing = ["rand"]
ai = ["ollama-rs"]
vector-similarity = ["chrono", "uuid"]
text-matching = []

[dependencies]
serde.workspace = true
schemars = "1.2"
diesel = { version = "^2.2.4", features = ["chrono", "uuid"], optional = true }
uuid = { version = "1.0", features = ["serde", "v4"], optional = true }
pgvector = { version = "0.4.0", features = ["diesel"], optional = true }
ollama-rs = { workspace = true, optional = true }
rand = { version = "0.10", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
