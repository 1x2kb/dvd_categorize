[package]
name = "csv_utils"
version = "1.0.0"
edition = "2021"
description = "CSV parsing and serialization utilities for movie data import/export"
readme = "README.md"

[features]
postgres = ["models/postgres"]
vector-similarity = ["models/vector-similarity"]
default = ["postgres", "vector-similarity"]

[dependencies]
csv = "*"
models = { path = "../models" }
serde = { version = "1.0.214", features = ["derive"] }