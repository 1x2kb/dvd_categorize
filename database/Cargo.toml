[package]
name = "database"
version = "1.0.0"
edition = "2021"
description = "Async PostgreSQL database layer with Diesel ORM, pgvector support, and structured search"
readme = "README.md"

[features]
default = ["postgres"]
testing = ["rand"]
postgres = [
    "diesel/postgres",
    "diesel-async/postgres",
    "models/postgres",
    "models/vector-similarity",
    "pgvector",
]
mongodb = ["dep:mongodb", "dep:qdrant-client", "models/vector-similarity"]
ai = []

[[example]]
name = "trait_usage"
required-features = ["testing"]

[dependencies]
async-trait.workspace = true
chrono = "0.4"
diesel.workspace = true
uuid = "1.0"
diesel-async.workspace = true
deadpool.workspace = true
dotenvy = "0.15"
rand = { version = "0.10", optional = true }
tokio.workspace = true
serde.workspace = true
log.workspace = true
env_logger.workspace = true
tracing.workspace = true
models = { path = "../models", features = ["ai"] }
pgvector = { version = "0.4.0", features = ["diesel"], optional = true }
mongodb = { version = "3.7.0", optional = true }
qdrant-client = { workspace = true, optional = true }
