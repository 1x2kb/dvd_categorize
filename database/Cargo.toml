[package]
name = "database"
version = "1.0.0"
edition = "2021"
description = "Async PostgreSQL database layer with Diesel ORM, pgvector support, and structured search"
readme = "README.md"

[features]
testing = ["rand"]

[dependencies]
async-trait = "0.1"
chrono = "0.4"
diesel = { version = "^2.2.4" }
diesel-async = { version = "0.8.0", features = ["postgres"] }
dotenvy = "0.15"
rand = { version = "0.10", optional = true }
tokio.workspace = true
serde.workspace = true
log.workspace = true
env_logger.workspace = true
tracing.workspace = true
models = { path = "../models", features = ["postgres", "ai"] }
pgvector = { version = "0.4.0", features = ["diesel"] }
ai_chat = { path = "../ai_chat" }
