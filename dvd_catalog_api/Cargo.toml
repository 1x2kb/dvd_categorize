[package]
name = "dvd_catalog_api"
version = "1.0.0"
edition = "2021"
description = "Axum REST API server for DVD catalog with search orchestration and caching"

[lib]
name = "dvd_catalog"
path = "./src/lib.rs"


[dependencies]
axum = "0.8.9"
axum-macros = "0.5.1"
tower-http = { version = "0.6", features = ["cors"] }
log.workspace = true
env_logger.workspace = true
tracing.workspace = true
tokio.workspace = true
database = { path = "../database" }
models = { path = "../models", features = [
    "vector-similarity",
    "text-matching",
] }
dotenvy.workspace = true
ai_chat = { path = "../ai_chat" }
ollama-rs.workspace = true
csv_utils = { path = "../csv_utils" }
categorizer_utilities = { path = "../categorizer_utilities" }
serde.workspace = true
