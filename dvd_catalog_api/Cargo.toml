[package]
name = "dvd_catalog_api"
version = "1.0.0"
edition = "2021"
description = "Axum REST API server for DVD catalog with search orchestration and caching"

[lib]
name = "dvd_catalog"
path = "./src/lib.rs"


[dependencies]
axum = "0.8.9"
axum-macros = "0.5.1"
tower-http = { version = "0.6", features = ["cors"] }
uuid = "1.0"
serde_json = "1.0"
async-stream.workspace = true
futures-util = "0.3"
tokio-stream = "0.1"
log.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tokio.workspace = true
database = { path = "../database" }
models = { path = "../models", features = [
    "vector-similarity",
    "text-matching",
] }
dotenvy.workspace = true
ai_chat = { path = "../ai_chat" }
ai_tools = { path = "../ai_tools" }
ollama-rs.workspace = true
csv_utils = { path = "../csv_utils" }
categorizer_utilities = { path = "../categorizer_utilities" }
prompts = { path = "../prompts" }
serde.workspace = true

[features]
default = ["postgres", "ai"]
internet = ["ai_chat/internet"]
postgres = ["database/postgres"]
ai = ["database/ai"]
