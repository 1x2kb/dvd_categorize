[package]
name = "dvd_categorizer_web"
version = "1.0.0"
authors = ["1x2kb <natemeyer@protonmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
console_error_panic_hook = "0.1.7"
dioxus = { version = "0.7.6", features = ["router"] }
dioxus_grapher = { path = "../dioxus_grapher" }
log.workspace = true
wasm-logger = "0.2"
dotenvy.workspace = true
models = { path = "../models", features = [] }
reqwest = { version = "0.13.2", default-features = false, features = ["json"] }
serde.workspace = true
wasm-bindgen = "0.2"
web-sys = { version = "0.3.77", features = ["Window", "Location", "Document", "Element", "HtmlElement", "HtmlInputElement", "CssStyleDeclaration", "EventTarget"] }
chrono = "0.4"
gloo-timers = { version = "0.4", features = ["futures"] }

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
