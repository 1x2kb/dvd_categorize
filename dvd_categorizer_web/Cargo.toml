[package]
name = "dvd_categorizer_web"
version = "1.0.0"
authors = ["1x2kb <natemeyer@protonmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
console_error_panic_hook = "0.1.7"
dioxus = { workspace = true, features = ["router"] }
dioxus_grapher = { path = "../dioxus_grapher" }
log.workspace = true
wasm-logger = "0.2"
dotenvy.workspace = true
models = { path = "../models", features = [] }
reqwest = { version = "0.13.2", default-features = false, features = ["json"] }
serde.workspace = true
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3.77", features = ["Window", "Location", "Document", "Element", "HtmlElement", "HtmlInputElement", "CssStyleDeclaration", "EventTarget", "ReadableStream", "ReadableStreamDefaultReader", "Response", "Request", "RequestInit", "RequestMode", "Headers"] }
chrono = "0.4"
gloo-timers = { version = "0.4", features = ["futures"] }
gloo-net = "0.6"
pulldown-cmark = "0.12"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
