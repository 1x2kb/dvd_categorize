[package]
name = "ai_chat"
version = "1.0.0"
edition = "2021"
description = "Ollama integration for AI-powered features: embeddings, query enhancement, and structured query parsing"
readme = "README.md"

[dependencies]
ollama-rs.workspace = true
models = { path = "../models", features = ["ai"] }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
tracing.workspace = true
tokio = { version = "1.0", features = ["rt", "macros"] }

[dev-dependencies]
models = { path = "../models", features = ["ai", "testing"] }
