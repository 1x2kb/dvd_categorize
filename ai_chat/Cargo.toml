[package]
name = "ai_chat"
version = "1.0.0"
edition = "2021"
description = "Ollama integration for AI-powered features: embeddings, query enhancement, and structured query parsing"
readme = "README.md"

[features]
internet = ["reqwest", "scraper"]

[dependencies]
database = { path = "../database" }
models = { path = "../models", features = ["postgres", "ai"] }
ollama-rs.workspace = true
prompts = { path = "../prompts" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
env_logger.workspace = true
tracing.workspace = true
tokio.workspace = true
reqwest = { version = "0.12", features = ["json"], optional = true }
scraper = { version = "0.23", optional = true }

[dev-dependencies]
models = { path = "../models", features = ["ai", "testing"] }
