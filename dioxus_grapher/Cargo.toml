[package]
name = "dioxus_grapher"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dioxus = { workspace = true, features = ["web"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
gloo-timers = { version = "0.4", features = ["futures"] }
web-sys = { version = "0.3.77", features = [
    "CanvasGradient",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "HtmlCanvasElement",
    "HtmlElement",
    "MouseEvent",
    "TextMetrics",
    "Window",
] }

[dev-dependencies]
dioxus = { workspace = true, features = ["web"] }
