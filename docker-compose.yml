  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  pgdata:
  ollama_data:
    external: true

