services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: app_user # Change for your use
      POSTGRES_PASSWORD: strongpassword # Change for your use
      POSTGRES_DB: app_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:rocm
    ports:
      - "0.0.0.0:11434:11434"
    volumes:
      - ollama_data:/root/.ollama # Persistent storage for models.
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    devices:
      - /dev/kfd # AMD compute device
      - /dev/dri/renderD128 # First AMD GPU
    group_add:
      - video # Required for GPU access
    security_opt:
      - seccomp:unconfined # Needed for memory mapping
    cap_add:
      - SYS_PTRACE # Required for ROCm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  dvd_categorize_api:
    build:
      context: .
      dockerfile: docker/run/api.Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
        USERNAME: ${USERNAME}
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - ./:/app
    depends_on:
      diesel_migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app_user:strongpassword@postgres:5432/app_db
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: dvd_catalog
      REDIS_URL: redis://redis:6379
      RUST_LOG: "info,dvd_catalog=debug,database=debug,ai_chat=debug,models=debug,csv_utils=debug,categorizer_utilities=debug"
      server_host: ${SERVER_HOST:-0.0.0.0}
      server_port: ${SERVER_PORT:-3000}
      OLLAMA_HOST: ollama
      OLLAMA_PORT: "11434"
      OLLAMA_NUM_CTX: "18000"

  dvd_categorize_web:
    build:
      context: .
      dockerfile: docker/run/web.Dockerfile
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - ./:/app

  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  diesel_migrate:
    build:
      context: .
      dockerfile: docker/run/diesel.Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
        USERNAME: ${USERNAME}
    volumes:
      - ./:/app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app_user:strongpassword@postgres:5432/app_db
      RUST_LOG: debug
    working_dir: /app/database
    command: ["diesel", "migration", "run"]
    restart: "no"  # Don't restart after completion

volumes:
  postgres_data:
  redis_data:
  pgdata:
  mongo_data:
  ollama_data: # Note that this must be created manually. Prevents it from being deleted on docker compose down -v since models are very large files.
    external: true 
