[workspace]
members = [
    "ai_chat",
    "categorizer_utilities",
    "csv_reader",
    "database",
    "dvd_catalog_api",
    "models",
    "dvd_categorizer_web", "csv_utils",
]

resolver = "2"

[workspace.dependencies]
log = "0.4"
env_logger = "0.11.3"
tracing = "0.1.41"
tokio = { version = "1.43.0", features = ["full"] }
dotenvy = "0.15"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
ollama-rs = { version = "0.2.4", features = ["tokio"] }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
