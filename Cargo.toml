[workspace]
members = [
    "ai_chat",
    "categorizer_utilities",
    "database",
    "dvd_catalog_api",
    "models",
    "dvd_categorizer_web",
    "csv_utils",
    "actor_reorder",
]

resolver = "2"

[workspace.dependencies]
log = "0.4"
env_logger = "0.11.3"
tracing = "0.1.41"
tokio = { version = "1.43.0", features = ["full"] }
dotenvy = "0.15"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
ollama-rs = { version = "0.3.4", features = ["tokio"] }

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[profile.release]
debug = 0
lto = true
codegen-units = 1
opt-level = 3

# WASM-specific optimizations for frontend (optimize for size)
[profile.release.package."*"]
opt-level = 3

[profile.release.package.dvd_categorizer_web]
opt-level = "z"
