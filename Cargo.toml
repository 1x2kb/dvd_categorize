[workspace]
members = [
    "ai_chat",
    "categorizer",
    "categorizer_utilities",
    "csv_reader",
    "database",
    "dvd_catalog_api",
    "models"
]

resolver = "2"

[workspace.dependencies]
log = "0.4"
pretty_env_logger = "0.5.0"
tracing = "0.1.41"
tokio = { version = "1.43.0", features = ["full"] }
dotenvy = "0.15"
serde = { version = "1.0.217", features = ["derive"] }
