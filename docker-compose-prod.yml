version: '3.8'

volumes:
  pgdata:
  ollama_data: # Note that this must be created manually. Prevents it from being deleted on docker compose down -v since models are very large files.
    external: true
  redis_data:

services:
  postgres-prod:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strongpassword}
      POSTGRES_DB: app_db
    ports:
      - "0.0.0.0:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgresql/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama-prod:
    image: ollama/ollama:rocm
    ports:
      - "0.0.0.0:11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    devices:
      - /dev/kfd
      - /dev/dri/renderD128
    group_add:
      - video
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || curl -f http://localhost:11434/api/version || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  redis-prod:
    image: redis:alpine
    ports:
      - "0.0.0.0:6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  diesel_migrate-prod:
    build:
      context: .
      dockerfile: docker/prod/diesel.Dockerfile
    depends_on:
      postgres-prod:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app_user:${POSTGRES_PASSWORD:-strongpassword}@postgres-prod:5432/app_db
    restart: "no"

  dvd_categorize_api-prod:
    build:
      context: .
      dockerfile: docker/prod/api.Dockerfile
    ports:
      - "0.0.0.0:3000:3000"  # API port
    depends_on:
      diesel_migrate-prod:
        condition: service_completed_successfully
      postgres-prod:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app_user:${POSTGRES_PASSWORD:-strongpassword}@postgres-prod:5432/app_db
      RUST_LOG: ${RUST_LOG:-info}
      server_host: 0.0.0.0
      server_port: 3000
      OLLAMA_HOST: ollama-prod
      OLLAMA_PORT: "11434"
      OLLAMA_NUM_CTX: "10000"
    restart: unless-stopped

  dvd_categorize_web-prod:
    build:
      context: .
      dockerfile: docker/prod/web.Dockerfile
    ports:
      - "0.0.0.0:8080:8080"  # Web UI port
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    restart: unless-stopped

  csv_reader-prod:
    build:
      context: .
      dockerfile: docker/prod/csv.Dockerfile
    depends_on:
      diesel_migrate-prod:
        condition: service_completed_successfully
      postgres-prod:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app_user:${POSTGRES_PASSWORD:-strongpassword}@postgres-prod:5432/app_db
    volumes:
      - ./movies.csv:/app/movies.csv:ro
    restart: "no"
    profiles:
      - database_load  # This prevents it from starting with docker-compose up
