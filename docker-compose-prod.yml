services:
  postgres-prod:
    profiles: ["postgres"]
    image: pgvector/pgvector:pg17
    networks:
      - dvd-net-prod
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strongpassword}
      POSTGRES_DB: app_db
    ports:
      - "0.0.0.0:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongodb-prod:
    profiles: ["mongodb"]
    image: mongo:7
    networks:
      - dvd-net-prod
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mongopassword}
      MONGO_INITDB_DATABASE: dvd_catalog
    ports:
      - "0.0.0.0:27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo-express-prod:
    profiles: ["mongodb"]
    image: mongo-express:latest
    networks:
      - dvd-net-prod
    ports:
      - "8083:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-mongopassword}
      ME_CONFIG_MONGODB_URL: mongodb://admin:${MONGO_PASSWORD:-mongopassword}@mongodb-prod:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb-prod
    restart: unless-stopped

  qdrant-prod:
    image: qdrant/qdrant:latest
    networks:
      - dvd-net-prod
    ports:
      - "6335:6333"  # HTTP API
      - "6336:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  ollama-prod:
    image: ollama/ollama:rocm
    networks:
      - dvd-net-prod
    ports:
      - "0.0.0.0:11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    devices:
      - /dev/kfd
      - /dev/dri/renderD128
    group_add:
      - video
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_PTRACE
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || curl -f http://localhost:11434/api/version || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  diesel_migrate-prod:
    profiles: ["postgres"]
    networks:
      - dvd-net-prod
    build:
      context: .
      dockerfile: docker/prod/diesel.Dockerfile
    depends_on:
      postgres-prod:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://app_user:${POSTGRES_PASSWORD:-strongpassword}@postgres-prod:5432/app_db
    restart: "no"

  dvd_categorize_api-prod:
    profiles: ["postgres"]
    networks:
      - dvd-net-prod
    build:
      context: .
      dockerfile: docker/prod/api.Dockerfile
      args:
        FEATURES: internet,ai,postgres
    ports:
      - "0.0.0.0:3000:3000"  # API port
    depends_on:
      diesel_migrate-prod:
        condition: service_completed_successfully
      postgres-prod:
        condition: service_healthy
      qdrant-prod:
        condition: service_started
    environment:
      DATABASE_URL: postgres://app_user:${POSTGRES_PASSWORD:-strongpassword}@postgres-prod:5432/app_db
      QDRANT_URL: http://qdrant-prod:6334
      QDRANT_COLLECTION: movies
      RUST_LOG: ${RUST_LOG:-info}
      server_host: 0.0.0.0
      server_port: 3000
      OLLAMA_HOST: ollama-prod
      OLLAMA_PORT: "11434"
      OLLAMA_NUM_CTX: "10000"
    restart: unless-stopped

  dvd_categorize_api-prod-mongo:
    profiles: ["mongodb"]
    networks:
      - dvd-net-prod
    build:
      context: .
      dockerfile: docker/prod/api.Dockerfile
      args:
        FEATURES: mongodb,internet,ai
    ports:
      - "0.0.0.0:3000:3000"  # API port
    depends_on:
      mongodb-prod:
        condition: service_healthy
      qdrant-prod:
        condition: service_started
    environment:
      MONGODB_URI: mongodb://admin:${MONGO_PASSWORD:-mongopassword}@mongodb-prod:27017/dvd_catalog?authSource=admin
      QDRANT_URL: http://qdrant-prod:6334
      QDRANT_COLLECTION: movies
      RUST_LOG: ${RUST_LOG:-info}
      server_host: 0.0.0.0
      server_port: 3000
      OLLAMA_HOST: ollama-prod
      OLLAMA_PORT: "11434"
      OLLAMA_NUM_CTX: "10000"
    restart: unless-stopped

  dvd_categorize_web-prod:
    profiles: ["postgres"]
    networks:
      - dvd-net-prod
    build:
      context: .
      dockerfile: docker/prod/web.Dockerfile
      args:
        FEATURES: postgres-api
    ports:
      - "0.0.0.0:8080:8080"  # Web UI port
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    restart: unless-stopped

  dvd_categorize_web-prod-mongo:
    profiles: ["mongodb"]
    networks:
      - dvd-net-prod
    build:
      context: .
      dockerfile: docker/prod/web.Dockerfile
      args:
        FEATURES: mongodb-api
    ports:
      - "0.0.0.0:8080:8080"  # Web UI port
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    restart: unless-stopped

volumes:
  pgdata:
  mongo_data:
  qdrant_data:
  ollama_data:
    external: true

networks:
  dvd-net-prod:
    driver: bridge
